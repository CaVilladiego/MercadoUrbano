apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
  namespace: mercadourbano
  labels:
    app: notificaciones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notificaciones
  template:
    metadata:
      labels:
        app: notificaciones
    spec:
      containers:
        - name: notificaciones
          image: <your-registry>/notificaciones:latest
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "production"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10