apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-usuarios
  namespace: mercadourbano
  labels:
    app: auth-usuarios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-usuarios
  template:
    metadata:
      labels:
        app: auth-usuarios
    spec:
      containers:
        - name: auth-usuarios
          image: <your-registry>/auth-usuarios:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: "postgresql://mu:mu@db-auth:5432/mercadourbano"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10