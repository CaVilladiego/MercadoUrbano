version: "3.9"

services:
  # Base de datos para auth-usuarios
  db-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: mu
      POSTGRES_DB: mercadourbano
    ports:
      - "5432:5432"
    volumes:
      - db_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d mercadourbano"]
      interval: 5s
      timeout: 5s
      retries: 20

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # Microservicio auth-usuarios
  auth-usuarios:
    build: ./auth-usuarios
    container_name: auth-usuarios
    environment:
      DATABASE_URL: postgres://mu:mu@db-auth:5432/mercadourbano
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      db-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "3001:3001"

  # Microservicio notificaciones
  notificaciones:
    build: ./notificaciones
    container_name: notificaciones
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_started
    ports:
      - "3002:3002"

  # Base de datos para recomendaciones
  db-recomendaciones:
    image: postgres:16
    environment:
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: mu
      POSTGRES_DB: recomendaciones
    ports:
      - "5433:5432"
    volumes:
      - db_recomendaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d recomendaciones"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API de recomendaciones
  api-recomendaciones:
    build: ./recomendaciones
    env_file:
      - ./recomendaciones/.env
    environment:
      DATABASE_URL: postgres://mu:mu@db-recomendaciones:5432/recomendaciones
    depends_on:
      db-recomendaciones:
        condition: service_healthy
    ports:
      - "3000:3001"
    command: >
      sh -c "npx prisma migrate deploy --schema=src/infrastructure/prisma/schema.prisma &&
             npm run start:prod"


  # Base de datos para catálogo de productos
  db-catalogo:
    image: postgres:16
    environment:
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: mu
      POSTGRES_DB: catalogo_productos
    ports:
      - "5434:5432"
    volumes:
      - db_catalogo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d catalogo_productos"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API de catálogo
  catalogo-productos:
    build: ./catalogo-productos
    ports:
      - "3004:3004"
    volumes:
      - ./catalogo-productos:/app
      - /app/node_modules
    env_file:
      - ./catalogo-productos/.env

  # Base de datos para pedidos
  db-pedidos:
    image: postgres:16
    environment:
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: mu
      POSTGRES_DB: pedidos
    ports:
      - "5435:5432"
    volumes:
      - db_pedidos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_auth_data:
  db_recomendaciones_data:
  db_catalogo_data:
  db_pedidos_data:
